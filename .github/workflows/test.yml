name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Build check
        run: bun run build

  smoke-test:
    name: "Clean Room Smoke Test (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (NPM)
        run: npm install

      - name: Setup Bun (For Build)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build JS Distribution
        run: npm run build

      - name: Package & Global Install Smoke Test
        run: |
          tarball=$(npm pack)
          npm install -g "$tarball"
          skill-harbor --help
          skill-harbor list

  changeset-gate:
    name: "Changeset Consistency Check"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Changeset Presence
        run: |
          echo "Checking for new changesets between origin/${{ github.base_ref }} and ${{ github.head_ref }}..."
          
          # Find new .md files in .changeset/ (excluding README) added in this PR
          NEW_CHANGESETS=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD | grep "^\.changeset/.*\.md$" | grep -v "\.changeset/README\.md$" || true)
          
          if [ -z "$NEW_CHANGESETS" ]; then
            echo "----------------------------------------------------------------"
            echo "❌ ERROR: No new changeset file found in the .changeset/ directory."
            echo "----------------------------------------------------------------"
            echo "Every Pull Request must include a changeset to document the impact"
            echo "of your changes on the versioning and changelog."
            echo ""
            echo "👉 Run 'bun run quartermaster' to generate one with maritime flair."
            echo "----------------------------------------------------------------"
            exit 1
          fi
          
          echo "✅ Found new changeset(s):"
          echo "$NEW_CHANGESETS"
