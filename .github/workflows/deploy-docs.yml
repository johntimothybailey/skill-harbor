name: Deploy Docs Site to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'apps/manual/**'
      - 'docs/**'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  EXPECTED_VERCEL_ORG_ID: team_wRHFZd1jH5umsxLiR2L4Abdl
  EXPECTED_VERCEL_PROJECT_ID: prj_0epyLZtsC026dEPcwdoGTn5TVgLf
  EXPECTED_VERCEL_PROJECT_NAME: skill-harbor-manual

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify Vercel project linkage
        run: |
          echo "Expected Vercel project: $EXPECTED_VERCEL_PROJECT_NAME"
          echo "Expected org id: $EXPECTED_VERCEL_ORG_ID"
          echo "Expected project id: $EXPECTED_VERCEL_PROJECT_ID"

          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "❌ Missing Vercel project secrets."
            echo "   Required: VERCEL_ORG_ID and VERCEL_PROJECT_ID"
            exit 1
          fi

          if [ "$VERCEL_ORG_ID" != "$EXPECTED_VERCEL_ORG_ID" ]; then
            echo "❌ VERCEL_ORG_ID does not match the linked apps/manual project."
            echo "   Expected: $EXPECTED_VERCEL_ORG_ID"
            echo "   Received: $VERCEL_ORG_ID"
            exit 1
          fi

          if [ "$VERCEL_PROJECT_ID" != "$EXPECTED_VERCEL_PROJECT_ID" ]; then
            echo "❌ VERCEL_PROJECT_ID does not match the linked apps/manual project."
            echo "   Expected: $EXPECTED_VERCEL_PROJECT_ID"
            echo "   Received: $VERCEL_PROJECT_ID"
            exit 1
          fi

          echo "✅ Vercel project secrets match the linked manual app."

      - name: Build Next.js Documentation App
        run: bunx turbo run build --filter=manual

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        working-directory: ./apps/manual
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=$VERCEL_TOKEN
        working-directory: ./apps/manual
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        working-directory: ./apps/manual
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
