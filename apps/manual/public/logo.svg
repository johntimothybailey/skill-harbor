<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1c" />
      <stop offset="100%" stop-color="#1e2947" />
    </linearGradient>

    <!-- Anchor Gradient (Vivid Cyan to Royal Blue) -->
    <linearGradient id="anchorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <!-- Accent Gradient (Mint/Lime glow for AI nodes) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b" />
      <stop offset="100%" stop-color="#38f9d7" />
    </linearGradient>
  </defs>

  <!-- Premium Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle border for depth -->
  <rect x="16" y="16" width="480" height="480" rx="120" stroke="#2c3c63" stroke-width="4" />

  <!-- Outer Harbor/Dock circle (dashed container) -->
  <circle cx="256" cy="256" r="180" stroke="rgba(79, 172, 254, 0.15)" stroke-width="12" stroke-dasharray="20 20" />

  <!-- Core Anchor -->
  <g stroke="url(#anchorGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ring -->
    <circle cx="256" cy="140" r="32" fill="none" />
    <!-- Shank -->
    <line x1="256" y1="172" x2="256" y2="390" />
    <!-- Stock -->
    <line x1="140" y1="220" x2="372" y2="220" />
    <!-- Lower Arms curve -->
    <path d="M 120 300 C 120 440, 392 440, 392 300" fill="none" />
  </g>

  <!-- Sleek Flukes (Spear tips) -->
  <g fill="url(#anchorGrad)">
    <path d="M 120 300 L 90 320 L 120 240 L 150 320 Z" />
    <path d="M 392 300 L 362 320 L 392 240 L 422 320 Z" />
  </g>

  <!-- AI Intelligence Nodes -->
  <g fill="url(#accentGrad)">
    <!-- Top node inside ring -->
    <circle cx="256" cy="140" r="16" />
    <!-- Left stock node -->
    <circle cx="140" cy="220" r="16" />
    <!-- Right stock node -->
    <circle cx="372" cy="220" r="16" />
    <!-- Bottom peak node -->
    <circle cx="256" cy="390" r="20" />
  </g>

</svg>
